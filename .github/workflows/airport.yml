name: Airport

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3h — the clock on the board is the last redraw
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '!scripts/pass/**'
      - '.github/workflows/airport.yml'

permissions:
  contents: write

concurrency:
  group: airport
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: ${{ github.repository_owner }}
      # classic PAT with `repo` scope, so private repos (HirumaBot/hiruma) can board too
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      TZ_NAME: Europe/Paris
      # bare name = yours, owner/name = anyone's. Order doesn't matter.
      REPOS: >-
        42-libasm, 42-Inception, bunny, brainfxcker, 42-Hotrace, 42-AlCu,
        42-webserv, 42-ft_shmup, 42-libunit, 42-cpp_09, 42-ft_nm, 42-cub3D,
        42-Philosophers, 42-minishell, ObanaiBot,
        mdourdoi/ft_transcendance, HirumaBot/hiruma, SpinUp-CLI/spinup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Departures board
        run: node scripts/board/index.mjs
        env:
          OUT: assets/departures.svg

      - name: Radar
        run: node scripts/radar/index.mjs
        env:
          OUT: assets/radar.svg
          DAYS: '180'

      - name: Commit if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/departures.svg assets/radar.svg
          git diff --staged --quiet && exit 0
          git commit -m 'chore: update the airport'
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
