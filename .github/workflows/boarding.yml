name: Boarding pass

# A visitor opens an issue titled "Boarding pass" (the README links to a
# prefilled one). They get their pass in a comment, the issue closes, and
# the departures board is redrawn so the ticker welcomes them aboard.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: boarding
  cancel-in-progress: false

jobs:
  issue:
    if: contains(github.event.issue.title, 'boarding pass')
    runs-on: ubuntu-latest
    env:
      # everything from the issue goes through env, never straight into a script
      PASSENGER: ${{ github.event.issue.user.login }}
      NUMBER: ${{ github.event.issue.number }}
      HOST: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      TZ_NAME: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print the pass
        run: node scripts/pass/index.mjs

      - name: Commit it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/passes assets/passengers.json
          git commit -m "chore: boarding pass for @$PASSENGER"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Hand it over
        run: |
          file="assets/passes/${PASSENGER,,}.svg"
          sha=$(git rev-parse HEAD)
          gh issue comment "$NUMBER" --body "$(printf '%s\n\n%s\n\n%s' \
            "Welcome aboard @$PASSENGER ✈️ — here is your boarding pass." \
            "![boarding pass](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$sha/$file)" \
            "Look for your name on the [departures board](https://github.com/$GITHUB_REPOSITORY) within a minute or two. Keep it: \`https://github.com/$GITHUB_REPOSITORY/blob/main/$file\`")"
          gh issue close "$NUMBER" --reason completed

      - name: Redraw the board
        run: gh workflow run airport.yml
